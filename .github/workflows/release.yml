name: Release desktop app

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build-ffmpeg:
    runs-on: macos-14
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - name: Install Windows cross compiler
        run: brew install mingw-w64
      - name: Build FFmpeg resources
        run: JOBS="$(sysctl -n hw.ncpu)" ./scripts/build-ffmpeg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-resources
          path: desktop/src-tauri/resources/ffmpeg

  bundle-macos:
    needs: build-ffmpeg
    runs-on: macos-14
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: ffmpeg-resources
          path: desktop/src-tauri/resources/ffmpeg
      - name: Remove non-macOS FFmpeg
        run: rm -rf src-tauri/resources/ffmpeg/windows-x64
      - name: Restore macOS FFmpeg permissions
        run: chmod 0755 src-tauri/resources/ffmpeg/macos-universal/ffmpeg
      - run: npm run tauri -- build --target universal-apple-darwin
      - uses: actions/upload-artifact@v4
        with:
          name: qmunlock-universal-apple-darwin
          path: |
            desktop/src-tauri/target/universal-apple-darwin/release/bundle/**/*.dmg

  bundle-windows:
    needs: build-ffmpeg
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: ffmpeg-resources
          path: desktop/src-tauri/resources/ffmpeg
      - name: Remove non-Windows FFmpeg
        shell: pwsh
        run: Remove-Item -Recurse -Force src-tauri/resources/ffmpeg/macos-universal
      - run: npm run tauri -- build --target x86_64-pc-windows-msvc
      - uses: actions/upload-artifact@v4
        with:
          name: qmunlock-x86_64-pc-windows-msvc
          path: |
            desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/**/*.msi
            desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/**/*.exe

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [bundle-macos, bundle-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: qmunlock-*
          merge-multiple: true
      - name: Publish unsigned release assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            **/*.dmg
            **/*.exe
            **/*.msi
